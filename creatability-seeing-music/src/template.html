<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8"/>
	<title>观看音乐</title>
	<script src="/node_modules/@webcomponents/webcomponentsjs/webcomponents-bundle.js"></script>
	<script src="/third_party/creatability-components/components.bundle.js"></script>

	<!-- META -->

	<!-- NAME -->
	<meta itemprop="name" content="Seeing Music">
	<meta name="twitter:title" content="Seeing Music">
	<meta property="og:title" content="Seeing Music">
	<meta property="og:site_name" content="Seeing Music">
	<!-- LINK -->
	<meta property="og:url" content="https://creatability.withgoogle.com/seeing-music/">
	<!-- DESCRIPTION -->
	<meta name="description" content="An experiment that lets you experience music visually.">
	<meta name="twitter:description" content="An experiment that lets you experience music visually.">
	<meta property="og:description" content="An experiment that lets you experience music visually.">
	<meta itemprop="description" content="An experiment that lets you experience music visually.">
	<!-- IMAGE -->
	<meta name="image" content="https://creatability.withgoogle.com/seeing-music/assets/SeeingMusic_Hero.jpg">
	<meta itemprop="image" content="https://creatability.withgoogle.com/seeing-music/assets/SeeingMusic_Hero.jpg">
	<meta property="og:image" content="https://creatability.withgoogle.com/seeing-music/assets/SeeingMusic_Hero.jpg">
	<meta name="twitter:image" content="https://creatability.withgoogle.com/seeing-music/assets/SeeingMusic_Hero.jpg">
	<meta property="og:image:alt" content="A circular, squiggly object in the center of the screen with rainbow-colored rectangles arranged horizontally to the left of it.">
	<meta name="twitter:image:alt" content="A circular, squiggly object in the center of the screen with rainbow-colored rectangles arranged horizontally to the left of it.">
	<!-- TYPE -->
	<meta name="twitter:card" content="summary">
	<meta property="og:type" content="website">

	<!-- END META -->

	<meta name="viewport" content="width=device-width, user-scalable=yes">

<!--	<link href="https://fonts.googleapis.com/css?family=Poppins:700" rel="stylesheet">-->
<!--	<link href="https://fonts.googleapis.com/css?family=Karla:400,700" rel="stylesheet">-->
<!--	<link href="https://fonts.googleapis.com/css?family=Rubik+Mono+One" rel="stylesheet">-->

	<link href="/assets/Poppins-font.css" rel="stylesheet">
	<link href="/assets/Karla-font.css" rel="stylesheet">
	<link href="/assets/Rubik-Mono-One-font.css" rel="stylesheet">

	<link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico">
</head>
<body>

	<!-- SIDE PANEL -->

	<acc-side-panel label="观看音乐">

		<acc-group id="audioInput" label="基础模式">

			<div class="blurb">
				使用此模式来可视化单声道音乐，如人声。
			</div>

			<acc-toggle id="mic" label="麦克风" disabled class="noPiano"></acc-toggle>

			<acc-select id='visualizer' label="可视化" class="noPiano"></acc-select>

			<acc-select id="inputSelect" label="示例声音" class="noPiano">

				<acc-item label="无"></acc-item>

			</acc-select>
		</acc-group>

		<acc-group id="model" label="钢琴模式">
			<div id="transcriptionInfo" class="blurb">
				<i>实验!</i> 切换到此模式以可视化复调音乐，如钢琴录音。你也可以用MIDI键盘现场演奏。这会禁用基础模式和麦克风输入。
			</div>
			<acc-toggle id="piano-enable" label="启用"></acc-toggle>
		</acc-group>

		<acc-group>
			<div id="file-drop">
				<input accept="audio/*" class="file-input" type="file" name="name" aria-hidden="true" style="display: none;"/>
				<acc-button id="uploadButton" label="选择你自己的文件"></acc-button>
				<button id="uploadedFile" class="nofile">未选择文件</button>
			</div>
		</acc-group>

		<acc-group>
			<acc-toggle id="color" checked label="颜色"></acc-toggle>
			<acc-toggle id="grid" label="网格与注释"></acc-toggle>
		</acc-group>

		<acc-learn-more-group link="https://experiments.withgoogle.com/seeing-music">
		</acc-learn-more-group>

		<acc-shortcut-group>
			<acc-shortcut-item key="Shift+M" command="静音"></acc-shortcut-item>
			<acc-shortcut-item key="Shift+P" command="暂停"></acc-shortcut-item>
		</acc-shortcut-group>

	</acc-side-panel>

	<!-- END SIDE PANEL -->

	<!-- CANVAS -->

	<canvas
		id="main-canvas"
		tabindex="0"
		aria-atomic="true"
		aria-live="polite">声音可视化</canvas>


	<!-- QUIET GROUP -->

	<acc-quiet-group dark></acc-quiet-group>

	<!-- TUTORIAL -->

	<acc-tutorial dark>
		<acc-slide
			video="/assets/s1.mp4"
			alt="Microphone with stream of color representing notes coming out of it."
			caption="这是一个可视化音乐的工具。你可以打开麦克风唱歌或播放声音。"></acc-slide>
		<acc-slide
			caption="你也可以插入自己的声音或视频文件。"
			alt="Mouse cursor dropping file, then a stream of notes comes out."
			video="/assets/s2.mp4"></acc-slide>
		<acc-slide
			caption="有些模式——比如希尔伯特望远镜和频谱图——展示了声音的细腻质感。"
			alt="Animation of circular sound visualization and vertical equalizer sound visualization."
			video="/assets/s3.mp4"></acc-slide>
		<acc-slide
			caption="还有一些则展示了不同旋律的路径和形状。"
			alt="Animation of circular visualization drawing ribbon of notes horizontally across the screen."
			video="/assets/s4.mp4"></acc-slide>
	</acc-tutorial>

	<!-- END TUTORIAL -->

	<!-- SPLASH -->

	<acc-splash dark
		image="/assets/splash.png"
		label="观看音乐"
		alt="带有彩虹丝带的麦克风穿过。"
		subtitle="视觉体验音乐。">

		<a href=“http://www.deafmusical.com” target=“_blank”>Jay Alan Zimmerman</a> 和 Google 合作。
		<br>
		更多实验请访问 <a href=“https://experiments.withgoogle.com/collection/creatability” target=“_blank”> Creatability </a> 网站

	</acc-splash>

	<!-- END SPLASH -->

	<!-- LOADER -->
	<acc-loader></acc-loader>

	<!-- FILE DROP -->
	<div class="fileDrop" aria-hidden="true"><div id="text">drop file</div></div>

	<!-- VIDEO GROUP -->
	<div id="video-group">
		<video playsinline autoplay loop="true" aria-hidden="true"></video>
		<button id="video-controls" class="playing" aria-label="pause instrument video" aria-pressed="false"></button>
	</div>

	<!-- END VIDEO GROUP -->

	<!-- ARIA ANOUNCING AREA -->
	<acc-snackbar aria-live="assertive" duration="5" aria-atomic="true"></acc-snackbar>
	<acc-snackbar
		id="error-snack"
		aria-live="assertive"
		error
		dismissable
		duration="8"
		aria-atomic="true"></acc-snackbar>

	<!-- FALLBACK -->
	<acc-fallback webaudio></acc-fallback>
</body>
</html>
