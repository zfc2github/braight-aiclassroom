  server {
  	listen 80;
  	server_name cms.education.braightidea.com;
 	return 301 https://$host$request_uri; # 强制跳转HTTPS，避免iOS兼容问题
  }

  server {
  	listen 443 ssl;
  	server_name cms.education.braightidea.com;
	root /var/www/braight-aiclassroom/braightidea_edu_aiclassroom/dist;
	index index.html;


    # 添加location块处理静态资源
    location / {
         # 设置允许跨域的域，* 表示允许任何域，也可以设置特定的域
         add_header 'Access-Control-Allow-Origin' '*';

         # 允许的方法
         add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';

         # 允许的头信息字段
         add_header 'Access-Control-Allow-Headers' 'User-Agent,Keep-Alive,Content-Type';

         # 缓存时间
         add_header 'Access-Control-Max-Age' 1728000;

         # 预检请求的处理
         if ($request_method = 'OPTIONS') {
             add_header 'Access-Control-Allow-Origin' '*';
             add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
             add_header 'Access-Control-Allow-Headers' 'User-Agent,Keep-Alive,Content-Type';
             add_header 'Access-Control-Max-Age' 1728000;
             add_header 'Content-Type' 'text/plain charset=UTF-8';
             add_header 'Content-Length' 0;
             return 204;
         }

         try_files $uri $uri/ /index.html;
     }

     # 配置后台服务的代理
     location /api/ {
       proxy_pass https://172.30.185.38:25172/admin/;
       proxy_set_header Host $host;
       proxy_set_header X-Real-IP $remote_addr;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto $scheme;
     }


    # 证书
    ssl_certificate     /var/www/braight-aiclassroom/cms.education.braightidea.com.pem;
    ssl_certificate_key /var/www/braight-aiclassroom/cms.education.braightidea.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    #ssl_prefer_server_ciphers off;
 }
