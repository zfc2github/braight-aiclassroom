# 项目相关配置
braight-master:
  # 名称
  name: braightidea-edu-aiclassroom
  # 版本
  version: 1.0.0
  # 版权年份
  copyrightYear: 2025
  # 实例演示开关
  demoEnabled: true
  # 文件路径
  profile: /var/www/braight-aiclassroom/braightidea_edu_aiclassroom/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  #APP模块，是通过jwt认证的，如果要使用APP模块，则需要修改【加密秘钥】
  jwt:
    #加密秘钥
    secret: f4e2e52034348f86b67cde581c0f9eb5[www.data-viz.cn]
    #token有效时长，7天，单位秒
    expire: 6048000000
    header: token

# 开发环境配置
server:
  # 服务器的HTTP端口,https
  port: 25172
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: prod
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 1024MB
      # 设置总上传的文件大小
      max-request-size: 1024MB
      enabled: true
  mail:
    host: smtp.tnlabs.xyz
    username: bn@tnlabs.xyz
    password: tnlabs*2023
    properties:
      mail:
        smtp:
          auth: true
          timeout: 25000
          socketFactory:
            class:
            port:
  jackson:
    mapper:
      default-view-inclusion: true

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）todo Shine 修改回默认值
  expireTime: 3600

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.braight.**.domain,com.braight.**.entity
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/system/content,/system/material
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
