<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI文生音乐工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            min-height: 100vh;
            padding: 20px;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            border: 1px solid rgba(94, 234, 212, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
            min-height: 400px;
        }

        .input-section {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: 1px solid rgba(94, 234, 212, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .input-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .input-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .input-header h3 {
            color: #f8fafc;
            font-size: 1.3em;
            margin-right: 10px;
            font-weight: 600;
        }

        .tooltip {
            position: relative;
            display: inline-block;
            cursor: help;
        }

        .tooltip-icon {
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .tooltip-text {
            visibility: hidden;
            width: 280px;
            background: rgba(15, 23, 42, 0.9);
            color: #e2e8f0;
            text-align: left;
            border-radius: 8px;
            padding: 12px;
            position: absolute;
            z-index: 1;
            bottom: 125%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 13px;
            line-height: 1.5;
            border: 1px solid rgba(94, 234, 212, 0.2);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            backdrop-filter: blur(5px);
        }

        .tooltip:hover .tooltip-text {
            visibility: visible;
            opacity: 1;
        }

        .input-textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid rgba(94, 234, 212, 0.3);
            border-radius: 10px;
            font-size: 14px;
            resize: vertical;
            transition: all 0.3s ease;
            font-family: inherit;
            background: rgba(15, 23, 42, 0.5);
            color: #f1f5f9;
        }

        .input-textarea:focus {
            outline: none;
            border-color: #5eead4;
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.2);
        }

        .input-textarea::placeholder {
            color: #94a3b8;
            font-style: italic;
        }

        .char-counter {
            text-align: right;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 5px;
        }

        .footer-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            grid-column: 1 / -1;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 15px;
            padding: 20px 30px;
            text-align: center;
            border: 1px solid rgba(94, 234, 212, 0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .generate-btn {
            width: 250px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .generate-btn:active {
            transform: translateY(0);
        }

        .generate-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            transform: rotate(30deg);
            pointer-events: none;
        }

        .generate-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loading-section {
            display: none;
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            border: 4px solid rgba(30, 41, 59, 0.3);
            border-top: 4px solid #0ea5e9;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 16px;
            color: #e2e8f0;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .loading-subtext {
            font-size: 14px;
            color: #94a3b8;
        }

        .result-section {
            display: none;
            text-align: center;
            padding: 30px;
        }

        .audio-player {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(94, 234, 212, 0.2);
        }

        .success-message {
            color: #34d399;
            font-size: 18px;
            margin-bottom: 20px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .error-message {
            color: #f87171;
            font-size: 16px;
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(220, 38, 38, 0.1);
            border-radius: 8px;
            border-left: 4px solid #ef4444;
        }

        .retry-btn {
            width: 250px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .music-info {
            background: rgba(15, 23, 42, 0.7);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
            border: 1px solid rgba(94, 234, 212, 0.1);
        }

        .music-info h4 {
            color: #5eead4;
            margin-bottom: 10px;
            font-size: 1.1em;
            border-bottom: 1px solid rgba(94, 234, 212, 0.2);
            padding-bottom: 8px;
        }

        .music-info p {
            margin: 8px 0;
            font-size: 14px;
            color: #cbd5e1;
            display: flex;
        }

        .music-info p strong {
            color: #f8fafc;
            min-width: 80px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }

            .header h1 {
                font-size: 2em;
            }

            .input-section {
                padding: 20px;
            }

            .tooltip-text {
                width: 250px;
                font-size: 12px;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(14, 165, 233, 0); }
            100% { box-shadow: 0 0 0 0 rgba(14, 165, 233, 0); }
        }

        .result-section-wrapper {
            display: flex;
            justify-content: center;
            width: 100%;
            grid-column: 1 / -1;
        }
        .result-section-wrapper > div {
            width: 60%;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎵 AI文生音乐工具</h1>
        <p>输入灵感与歌词，让AI为您创作独一无二的音乐</p>
    </div>

    <div class="main-content">
        <div class="input-section">
            <div class="input-header">
                <h3>创作灵感</h3>
                <div class="tooltip">
                    <div class="tooltip-icon">?</div>
                    <div class="tooltip-text">
                        表示音乐创作的灵感，通常是对音乐风格、情绪、场景等的描述。例如"流行音乐, 开心活泼, 适合在有朝阳的早晨"。字符范围【10，2000】。
                    </div>
                </div>
            </div>
            <textarea
                    id="promptInput"
                    class="input-textarea"
                    placeholder="流行音乐, 开心活泼, 适合在有朝阳的早晨..."
                    maxlength="2000"
            ></textarea>
            <div class="char-counter">
                <span id="promptCounter">0</span>/2000
            </div>
        </div>

        <div class="input-section">
            <div class="input-header">
                <h3>歌词</h3>
                <div class="tooltip">
                    <div class="tooltip-icon">?</div>
                    <div class="tooltip-text">
                        使用换行符（\n）分隔每行歌词，支持插入歌词结构入 [Intro], [Verse], [Chorus], [Bridge], [Outro] 等，有助于提升歌曲音乐性。字符范围【10，3000】
                    </div>
                </div>
            </div>
            <textarea
                    id="lyricsInput"
                    class="input-textarea"
                    placeholder="朝阳亲亲脸
小鸟说早呀
拍拍小手跳呀跳
新的一天开始啦"
                    maxlength="3000"
            ></textarea>
            <div class="char-counter">
                <span id="lyricsCounter">0</span>/3000
            </div>
        </div>

        <div class="footer-section">
            <button id="generateBtn" class="generate-btn">🎼 生成音乐</button>
        </div>

        <div class="result-section-wrapper">
            <div id="loadingSection" class="loading-section">
                <div class="loading-spinner"></div>
                <div class="loading-text">AI正在为您生成音乐</div>
                <div class="loading-subtext">这可能需要几分钟时间，请耐心等待...</div>
            </div>

            <div id="resultSection" class="result-section">
                <div class="success-message">🎉 音乐生成成功！</div>
                <audio id="audioPlayer" class="audio-player" controls></audio>
                <!--                <div id="musicInfo" class="music-info"></div>-->
                <!--                <button id="retryBtn" class="retry-btn">🔄 重新生成</button>-->
            </div>

            <div id="errorSection" class="result-section">
                <div class="error-message" id="errorMessage"></div>
                <!--                <button id="errorRetryBtn" class="retry-btn">🔄 重试</button>-->
            </div>
        </div>
    </div>
</div>

<script>
    class MusicGenerator {
        constructor() {
            this.initializeElements();
            this.bindEvents()
            this.backendUrl = 'https://education.braightidea.com/nodejsProxy';
        }

        initializeElements() {
            this.promptInput = document.getElementById('promptInput');
            this.lyricsInput = document.getElementById('lyricsInput');
            this.promptCounter = document.getElementById('promptCounter');
            this.lyricsCounter = document.getElementById('lyricsCounter');
            this.generateBtn = document.getElementById('generateBtn');
            this.loadingSection = document.getElementById('loadingSection');
            this.resultSection = document.getElementById('resultSection');
            this.errorSection = document.getElementById('errorSection');
            this.audioPlayer = document.getElementById('audioPlayer');
            // this.musicInfo = document.getElementById('musicInfo');
            // this.retryBtn = document.getElementById('retryBtn');
            // this.errorRetryBtn = document.getElementById('errorRetryBtn');
            this.errorMessage = document.getElementById('errorMessage');
        }

        bindEvents() {
            this.promptInput.addEventListener('input', () => this.updateCounter('prompt'));
            this.lyricsInput.addEventListener('input', () => this.updateCounter('lyrics'));
            this.generateBtn.addEventListener('click', () => this.generateMusic());
            // this.retryBtn.addEventListener('click', () => this.resetForm());
            // this.errorRetryBtn.addEventListener('click', () => this.resetForm());

            // 添加回车键提交功能
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') {
                    this.generateMusic();
                }
            });
        }

        updateCounter(type) {
            if (type === 'prompt') {
                const length = this.promptInput.value.length;
                this.promptCounter.textContent = length;
                this.promptCounter.style.color = length > 2000 ? '#e74c3c' : '#666';
            } else {
                const length = this.lyricsInput.value.length;
                this.lyricsCounter.textContent = length;
                this.lyricsCounter.style.color = length > 3000 ? '#e74c3c' : '#666';
            }
        }

        validateInputs() {
            const prompt = this.promptInput.value.trim();
            const lyrics = this.lyricsInput.value.trim();

            if (prompt.length < 10) {
                this.showError('创作灵感至少需要10个字符');
                return false;
            }

            if (prompt.length > 2000) {
                this.showError('创作灵感不能超过2000个字符');
                return false;
            }

            if (lyrics.length < 10) {
                this.showError('歌词至少需要10个字符');
                return false;
            }

            if (lyrics.length > 3000) {
                this.showError('歌词不能超过3000个字符');
                return false;
            }

            return true;
        }

        async generateMusic() {
            if (!this.validateInputs()) {
                return;
            }

            const prompt = this.promptInput.value.trim();
            const lyrics = this.lyricsInput.value.trim();

            this.showLoading();

            try {
                const response = await this.callMusicAPI(prompt, lyrics);
                console.log('generateMusic API response:', response);

                if (response?.data?.base_resp?.status_code === 0) {
                    this.showResult(response?.data);
                } else {
                    this.handleAPIError(response?.data);
                }
            } catch (error) {
                console.error('API调用错误:', error);
                this.showError('网络连接失败，请检查网络后重试');
            }
        }

        async callMusicAPI(prompt, lyrics) {
            const options = {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    prompt: prompt,
                    lyrics: lyrics
                })
            };

            const response = await fetch(`${this.backendUrl}/music_generation`, options);
            return await response.json();
        }

        handleAPIError(response) {
            const errorCode = response.base_resp.status_code;
            const errorMsg = response.base_resp.status_msg;

            let userMessage = '';
            switch (errorCode) {
                case 1002:
                    userMessage = '请求过于频繁，请稍后再试';
                    break;
                case 1004:
                    userMessage = 'API密钥验证失败，请联系技术支持';
                    break;
                case 1008:
                    userMessage = '账号余额不足，请联系管理员充值';
                    break;
                case 1026:
                    userMessage = '输入内容涉及敏感信息，请修改后重试';
                    break;
                case 2013:
                    userMessage = '输入参数异常，请检查内容是否符合要求';
                    break;
                case 2049:
                    userMessage = '无效的API密钥，请联系技术支持';
                    break;
                default:
                    userMessage = `请求失败：${errorMsg || '未知错误'}`;
            }

            this.showError(userMessage);
        }

        showLoading() {
            // this.generateBtn.style.display = 'none';
            this.resultSection.style.display = 'none';
            this.errorSection.style.display = 'none';
            this.loadingSection.style.display = 'block';
            this.loadingSection.classList.add('fade-in');

            // 添加脉冲效果
            this.loadingSection.classList.add('pulse');
        }

        showResult(response) {
            // this.generateBtn.style.display = 'block';
            this.loadingSection.style.display = 'none';
            this.errorSection.style.display = 'none';
            this.resultSection.style.display = 'block';
            this.resultSection.classList.add('fade-in');

            // 设置音频源
            this.audioPlayer.src = response.data.audio;

            // 显示音乐信息
           /* const info = response.extra_info;
            this.musicInfo.innerHTML = `
                    <h4>🎵 音乐信息</h4>
                    <p><strong>时长：</strong> ${this.formatDuration(info.music_duration)}</p>
                    <p><strong>采样率：</strong> ${info.music_sample_rate} Hz</p>
                    <p><strong>声道：</strong> ${info.music_channel === 2 ? '立体声' : '单声道'}</p>
                    <p><strong>比特率：</strong> ${(info.bitrate / 1000).toFixed(0)} kbps</p>
                    <p><strong>文件大小：</strong> ${this.formatFileSize(info.music_size)}</p>
                `;*/

            // 移除脉冲效果
            this.loadingSection.classList.remove('pulse');
        }

        showError(message) {
            // this.generateBtn.style.display = 'block';
            this.loadingSection.style.display = 'none';
            this.resultSection.style.display = 'none';
            this.errorSection.style.display = 'block';
            this.errorSection.classList.add('fade-in');
            this.errorMessage.textContent = message;

            // 移除脉冲效果
            this.loadingSection.classList.remove('pulse');
        }

        /*resetForm() {
            this.generateBtn.style.display = 'block';
            this.loadingSection.style.display = 'none';
            this.resultSection.style.display = 'none';
            this.errorSection.style.display = 'none';
            this.audioPlayer.src = '';
            this.musicInfo.innerHTML = '';
        }*/

        /*formatDuration(milliseconds) {
            const seconds = Math.floor(milliseconds / 1000);
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes}分${remainingSeconds}秒`;
        }

        formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }*/
    }

    // 初始化应用
    document.addEventListener('DOMContentLoaded', () => {
        new MusicGenerator();
    });

    // 添加一些交互效果
    document.addEventListener('DOMContentLoaded', () => {
        // 为输入框添加焦点效果
        const textareas = document.querySelectorAll('.input-textarea');
        textareas.forEach(textarea => {
            textarea.addEventListener('focus', function() {
                this.parentElement.style.transform = 'translateY(-2px)';
                this.parentElement.style.boxShadow = '0 8px 25px rgba(0,0,0,0.3)';
            });

            textarea.addEventListener('blur', function() {
                this.parentElement.style.transform = 'translateY(0)';
                this.parentElement.style.boxShadow = '0 4px 15px rgba(0,0,0,0.2)';
            });
        });

        // 添加页面加载动画
        const container = document.querySelector('.container');
        container.style.opacity = '0';
        container.style.transform = 'translateY(30px)';

        setTimeout(() => {
            container.style.transition = 'all 0.6s ease';
            container.style.opacity = '1';
            container.style.transform = 'translateY(0)';
        }, 100);
    });
</script>
</body>
</html>
