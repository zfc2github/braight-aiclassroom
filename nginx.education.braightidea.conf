  server {
  	listen 80;
  	server_name education.braightidea.com;
 	return 301 https://$host$request_uri; # 强制跳转HTTPS，避免iOS兼容问题
  }

  server {
  	listen 443 ssl;
  	server_name education.braightidea.com;
	root /var/www/braight-aiclassroom/braightidea-education/build;
	index index.html;

    client_max_body_size 20M;

	# 映射到声音分类训练
	location /voiceTraining {
        alias /var/www/braight-aiclassroom/voice-classification-training;
        index index.html;
	}

	# 映射到姿态分类训练
    location /poseTraining {
        alias /var/www/braight-aiclassroom/pose-classification-training;
        index index.html;
    }

	# 映射到图像分类训练
    location /imageClassificationTraining {
        alias /var/www/braight-aiclassroom/image-classification-training;
        index index.html;
    }

	# 映射到图生图
    location /image2image {
        alias /var/www/braight-aiclassroom/image2image;
        index index.html;
    }

	# 映射到文生图
    location /text2image {
        alias /var/www/braight-aiclassroom/text2image;
        index index.html;
    }

	# 映射到文生音乐
    location /text2music {
        alias /var/www/braight-aiclassroom/text2music;
        index index.html;
    }

	# 映射到文生视频
    location /text2video {
        alias /var/www/braight-aiclassroom/text2video;
        index index.html;
    }

	# 映射到 tfjsWebgl 演示：图像识别-手势识别、3D Pose、Blazepose、AgenGender、Classification、facemesh
    location /tfjsWebglApp {
        alias /var/www/braight-aiclassroom/tfjs_webgl_app;
        index index.html;
    }

	# 映射到声音复刻
    location /voiceCopy {
        alias /var/www/braight-aiclassroom/voiceCopy;
        index index.html;
    }

	# 映射到语音合成
    location /voiceGeneration {
        alias /var/www/braight-aiclassroom/voiceGeneration;
        index index.html;
    }

	# 映射到多模态大模型
    location /bigmodelChat {
        alias /var/www/braight-aiclassroom/bigmodel-chat;
        index index.html;
    }

	# 映射到语音识别
    location /voiceRecog {
        alias /var/www/braight-aiclassroom/voiceRecog;
        index index.html;
    }

	# 映射到文字识别
    location /textRecog {
        alias /var/www/braight-aiclassroom/textRecog;
        index index.html;
    }

	# 映射到人脸分析
    location /faceapi/ {
        proxy_pass http://8.153.197.39:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/.*_model-weights_manifest.*$ {
        proxy_pass http://8.153.197.39:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/.*_model-shard.*$ {
        proxy_pass http://8.153.197.39:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 映射到 Neural-Network-Visualisation
    location /nnv/ {
        proxy_pass http://8.153.197.39:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	# 映射到nodejs代理后台
    location /nodejsProxy/ {
        proxy_pass http://8.153.197.39:8602/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/link$ {
        set $target "";
        if ($args ~* "target=([^&]+)") {
            set $target $1;
        }

        if ($target = "") {
            return 400 "Missing or invalid target parameter";
        }

        set $decoded_target "";
        set_unescape_uri $decoded_target $target;

        return 302 $decoded_target;
    }

    location ~ ^/canva-design/(.*) {
        # 移除路径前缀，代理到Canva
        rewrite ^/canva-design/(.*)$ /design/$1 break;

        # 代理到Canva
        proxy_pass https://www.canva.cn;

        # 必要的代理头设置
        proxy_set_header Host www.canva.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin https://www.canva.cn;

        # 处理SSL连接
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 禁用压缩（关键）
        proxy_set_header Accept-Encoding "";
        # 确保不压缩响应
        gzip off;
        sub_filter_once off;
        sub_filter '</head>' '<style type="text/css">.aDc6Yg.oNSf9w > div > .A628dw:not(:last-child), .w0mBeQ._Sfcdg > .J_e6hA, .bfDIPQ, .GMhonQ.nGNIwg.RnXUFA.aaFj1w._6I90XA {display: none !important;}</style></head>';

    }

    location ~ ^/_ajax/(.*) {
        # 代理到Canva
        proxy_pass https://www.canva.cn;

        # 必要的代理头设置
        proxy_set_header Host www.canva.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin https://www.canva.cn;

        # 处理SSL连接
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

    }

    # 代理后台接口
    location /eduServer/ {
        proxy_pass https://8.133.19.252:25172/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 代理后台接口
    location /admin/ {
        proxy_pass https://8.133.19.252:25172/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 添加location块处理静态资源
    location / {
        try_files $uri $uri/ =404;
    }

    # 证书
    ssl_certificate     /var/www/braight-aiclassroom/education.braightidea.com.pem;
    ssl_certificate_key /var/www/braight-aiclassroom/education.braightidea.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    #ssl_prefer_server_ciphers off;
 }
