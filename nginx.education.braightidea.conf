  server {
  	listen 80;
  	server_name education.braightidea.com;
 	return 301 https://$host$request_uri; # 强制跳转HTTPS，避免iOS兼容问题
  }

  server {
  	listen 443 ssl;
  	server_name education.braightidea.com;
	root /var/www/braight-aiclassroom/braightidea-education/build;
	index index.html;

    client_max_body_size 20M;


    # 映射到 Scratch3 图形化编程
    location /scratch3/ {
        alias /var/www/braight-aiclassroom/braight-scratch3/build/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 映射到 semiconductor 智慧乐队
    location /semiconductor/ {
        alias /var/www/braight-aiclassroom/semi-conductor/dist/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # 映射到 QuickDraw 你画我猜
    location /quickdraw/ {
        proxy_pass http://172.30.185.39:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket支持
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        # CORS配置
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }

    # 映射到 seeingmusic 看见声音
    location = /seeingmusic/ {
        return 301 /seeingmusic/build/;
    }
    location /seeingmusic/ {
        alias /var/www/braight-aiclassroom/creatability-seeing-music/build/;
        index index.html;
        # 注意：proxy_pass 末尾的斜杠决定了路径替换行为
        # 此处配置会将 /seeingmusic/xxx 转发为 http://...:8106/xxx
        proxy_pass http://172.30.185.39:8106/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 映射到 Neural-Network-Visualisation
    location /nnv/ {
        proxy_pass http://8.153.197.39:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	# 映射到nodejs代理后台
    location /nodejsProxy/ {
        proxy_pass http://8.153.197.39:8602/;

        # 设置读取超时时间为 180 秒 (默认是 60 秒)
        proxy_read_timeout 180s;
        # 设置发送超时时间为 180 秒
        proxy_send_timeout 180s;
        # 可选：设置连接建立超时
        proxy_connect_timeout 60s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/link$ {
        set $target "";
        if ($args ~* "target=([^&]+)") {
            set $target $1;
        }

        if ($target = "") {
            return 400 "Missing or invalid target parameter";
        }

        set $decoded_target "";
        set_unescape_uri $decoded_target $target;

        return 302 $decoded_target;
    }

    location ~ ^/canva-design/(.*) {
        # 移除路径前缀，代理到Canva
        rewrite ^/canva-design/(.*)$ /design/$1 break;

        # 代理到Canva
        proxy_pass https://www.canva.cn;

        # 必要的代理头设置
        proxy_set_header Host www.canva.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin https://www.canva.cn;

        # 处理SSL连接
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 禁用压缩（关键）
        proxy_set_header Accept-Encoding "";
        # 确保不压缩响应
        gzip off;
        sub_filter_once off;
        sub_filter '</head>' '<style type="text/css">.aDc6Yg.oNSf9w > div > .A628dw:not(:last-child), .w0mBeQ._Sfcdg > .J_e6hA, .bfDIPQ, .GMhonQ.nGNIwg.RnXUFA.aaFj1w._6I90XA {display: none !important;}</style></head>';

    }

    location ~ ^/_ajax/(.*) {
        # 代理到Canva
        proxy_pass https://www.canva.cn;

        # 必要的代理头设置
        proxy_set_header Host www.canva.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin https://www.canva.cn;

        # 处理SSL连接
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

    }

    # 代理后台接口
    location /eduServer/ {
        proxy_pass https://172.30.185.38:25172/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 代理后台接口
    location /admin/ {
        proxy_pass https://172.30.185.38:25172/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 添加location块处理静态资源
    location / {
        try_files $uri $uri/ =404;
    }

    # 证书
    ssl_certificate     /var/www/braight-aiclassroom/education.braightidea.com.pem;
    ssl_certificate_key /var/www/braight-aiclassroom/education.braightidea.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    #ssl_prefer_server_ciphers off;
 }
