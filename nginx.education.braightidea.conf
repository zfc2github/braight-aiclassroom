  server {
  	listen 80;
  	server_name education.braightidea.com;
 	return 301 https://$host$request_uri; # 强制跳转HTTPS，避免iOS兼容问题
  }

  server {
  	listen 443 ssl;
  	server_name education.braightidea.com;
	root /var/www/braight-aiclassroom/braightidea-education/build;
	index index.html;

    location ~ ^/canva-design/(.*) {
        # 移除路径前缀，代理到Canva
        rewrite ^/canva-design/(.*)$ /design/$1 break;

        # 代理到Canva
        proxy_pass https://www.canva.cn;

        # 必要的代理头设置
        proxy_set_header Host www.canva.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin https://www.canva.cn;

        # 处理SSL连接
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # 禁用压缩（关键）
        proxy_set_header Accept-Encoding "";
        # 确保不压缩响应
        gzip off;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter '</head>' '<style type="text/css">.FJA3UA,._7_nW9A.V5ZeDQ {display: none !important;}</style></head>';

    }

    location ~ ^/_ajax/(.*) {
        # 代理到Canva
        proxy_pass https://www.canva.cn;

        # 必要的代理头设置
        proxy_set_header Host www.canva.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Origin https://www.canva.cn;

        # 处理SSL连接
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

    }

    # 代理后台接口
    location /eduServer/ {
        proxy_pass https://8.133.19.252:25172/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 代理后台接口
    location /admin/ {
        proxy_pass https://8.133.19.252:25172/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 添加location块处理静态资源
    location / {
        try_files $uri $uri/ =404;
    }

    # 证书
    ssl_certificate     /var/www/braight-aiclassroom/education.braightidea.com.pem;
    ssl_certificate_key /var/www/braight-aiclassroom/education.braightidea.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    #ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    #ssl_prefer_server_ciphers off;
 }
